<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema do Bar</title>
<style>
  :root {
    --preto: #0f0f0f;
    --preto-suave: #1a1a1a;
    --cinza-escuro: #2b2b2b;
    --cinza: #6b6b6b;
    --cinza-claro: #d8d8d8;
    --branco: #f7f7f5;
    --vermelho: #c81e1e;
    --vermelho-escuro: #8f1414;
    --radius: 14px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--preto);
    color: var(--branco);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .marca {
    text-align: center;
    margin-bottom: 48px;
  }

  .marca h1 {
    font-size: 2rem;
    letter-spacing: 0.5px;
    font-weight: 800;
  }

  .marca h1 span { color: var(--vermelho); }

  .marca p {
    color: var(--cinza-claro);
    font-size: 0.9rem;
    margin-top: 8px;
  }

  .opcoes {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
    width: 100%;
    max-width: 640px;
  }

  @media (max-width: 560px) {
    .opcoes { grid-template-columns: 1fr; }
  }

  .cartao-opcao {
    background: var(--preto-suave);
    border: 1px solid var(--cinza-escuro);
    border-radius: var(--radius);
    padding: 36px 28px;
    text-decoration: none;
    color: var(--branco);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 14px;
    transition: border-color 0.18s ease, transform 0.12s ease;
  }

  .cartao-opcao:hover {
    border-color: var(--vermelho);
    transform: translateY(-2px);
  }

  .cartao-opcao:active { transform: translateY(0); }

  .icone {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--cinza-escuro);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.6rem;
    transition: background 0.18s ease;
  }

  .cartao-opcao:hover .icone {
    background: var(--vermelho);
  }

  .cartao-opcao h2 {
    font-size: 1.15rem;
    font-weight: 700;
  }

  .cartao-opcao p {
    color: var(--cinza-claro);
    font-size: 0.84rem;
    line-height: 1.4;
  }

  footer {
    margin-top: 56px;
    color: var(--cinza);
    font-size: 0.75rem;
    text-align: center;
  }

  .status-backend {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 10px;
    font-size: 0.78rem;
    color: var(--cinza-claro);
  }

  .bolinha {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--cinza);
  }

  .bolinha.online { background: #6fcf97; }
  .bolinha.offline { background: var(--vermelho); }
</style>
</head>
<body>

  <div class="marca">
    <h1>Sistema do <span>Bar</span></h1>
    <p>Escolha o que você precisa fazer</p>
  </div>

  <div class="opcoes">
    <a href="atendimento.html" class="cartao-opcao">
      <div class="icone">🍽️</div>
      <h2>Atendimento</h2>
      <p>Abrir comandas e montar pedidos do cardápio</p>
    </a>

    <a href="caixa.html" class="cartao-opcao">
      <div class="icone">💳</div>
      <h2>Fechar Comanda</h2>
      <p>Ver a conta, receber o pagamento e cancelar comandas</p>
    </a>
  </div>

  <footer>
    <div id="statusTexto">Verificando conexão com o sistema...</div>
    <div class="status-backend">
      <span class="bolinha" id="bolinhaStatus"></span>
      <span id="statusBackend">verificando...</span>
    </div>
  </footer>

  <script>
    const API_URL = "https://sistema-bar-backend.onrender.com";

    async function verificarBackend(tentativa = 1) {
      const bolinha = document.getElementById("bolinhaStatus");
      const texto = document.getElementById("statusBackend");
      const statusTexto = document.getElementById("statusTexto");

      if (tentativa === 1) {
        texto.textContent = "conectando...";
        statusTexto.textContent = "O servidor pode levar até 1 minuto para responder na primeira vez.";
      }

      try {
        const resp = await fetch(`${API_URL}/`);
        if (resp.ok) {
          bolinha.className = "bolinha online";
          texto.textContent = "backend conectado";
          statusTexto.textContent = "";
          return;
        }
        throw new Error();
      } catch (erro) {
        if (tentativa < 6) {
          bolinha.className = "bolinha";
          texto.textContent = `tentando conectar (${tentativa}/6)...`;
          setTimeout(() => verificarBackend(tentativa + 1), 8000);
        } else {
          bolinha.className = "bolinha offline";
          texto.textContent = "não foi possível conectar";
          statusTexto.textContent = "Verifique sua internet e tente recarregar a página em alguns instantes.";
        }
      }
    }

    verificarBackend();
  </script>

</body>
</html>
